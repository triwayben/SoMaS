# Unraid Docker Compose Manager starting point for SoMaS.
#
# Copy this into a new stack in Unraid's Compose Manager, then replace <nas-ip> with the server's
# address (e.g. 192.168.1.20). These labels are what give the container its clickable WebUI button
# on the Unraid Docker and Dashboard pages.
#
# The icon needs no label at all: the image carries net.unraid.docker.icon pointing at the committed
# artwork in this repository, because Unraid downloads the picture itself and does not expand
# [IP]/[PORT:n] in an icon it fetches. The image carries managed=dockerman and the webui link too,
# because a plain `docker run` has no way to add labels; a stack overrides `managed` to
# composeman so Compose Manager owns the container.
services:
  somas:
    image: ghcr.io/triwayben/somas:latest
    container_name: somas
    restart: unless-stopped
    ports:
      - "8080:80"
    labels:
      net.unraid.docker.managed: composeman
      net.unraid.docker.webui: "http://<nas-ip>:8080/"
      # Optional: same mark, but served from your own NAS instead of the published copy.
      net.unraid.docker.icon: "http://<nas-ip>:8080/icons/icon-tile-128.png"
