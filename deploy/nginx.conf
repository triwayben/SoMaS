server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Build output filenames carry a content hash, so they never change under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The entry point and the deploy-time settings must be revalidated, or a new deploy keeps
  # serving the old bundle from the browser cache.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /config.json {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
